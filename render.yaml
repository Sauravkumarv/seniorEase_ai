services:
  - type: web
    name: seniorease-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: FLASK_DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
